<style>
.lab-stage{position:relative;isolation:isolate;min-height:calc(100vh - 150px);overflow:hidden;border:1px solid rgba(132,153,208,.2);border-radius:24px;background:radial-gradient(ellipse at 50% 8%,rgba(83,91,170,.28),transparent 38%),radial-gradient(ellipse at 12% 80%,rgba(33,91,126,.17),transparent 36%),linear-gradient(145deg,#0c1224 0%,#090d19 55%,#111329 100%);color:#edf0ff;display:grid;place-items:center;padding:48px 24px;box-shadow:0 28px 80px rgba(8,13,30,.22)}
.lab-stage:before,.lab-stage:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(2px)}
.lab-stage:before{width:440px;height:440px;top:-250px;left:calc(50% - 220px);border:1px solid rgba(173,184,255,.17);box-shadow:0 0 0 35px rgba(173,184,255,.025),0 0 0 75px rgba(173,184,255,.02),0 0 100px rgba(103,118,255,.16)}
.lab-stage:after{width:620px;height:620px;bottom:-480px;left:calc(50% - 310px);border:1px solid rgba(109,185,220,.13);box-shadow:0 0 0 48px rgba(109,185,220,.025),0 0 90px rgba(70,132,190,.1)}
.lab-stars{position:absolute;inset:0;z-index:-1;opacity:.55;background-image:radial-gradient(1px 1px at 12% 18%,#cbd6ff 98%,transparent),radial-gradient(1px 1px at 28% 72%,#b6c5ff 98%,transparent),radial-gradient(2px 2px at 76% 23%,#d8ddff 98%,transparent),radial-gradient(1px 1px at 87% 66%,#a4c8ed 98%,transparent),radial-gradient(1px 1px at 61% 84%,#cbd6ff 98%,transparent),radial-gradient(1px 1px at 43% 39%,#d8ddff 98%,transparent)}
.lab-empty{width:min(100%,500px);text-align:center;padding:30px 20px}
.lab-symbol{width:76px;height:76px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid rgba(176,190,255,.25);border-radius:24px;background:linear-gradient(145deg,rgba(112,130,210,.2),rgba(47,70,117,.1));box-shadow:0 0 55px rgba(102,121,220,.2),inset 0 1px rgba(255,255,255,.1);font-size:30px;color:#cbd2ff}
.lab-eyebrow{font-size:10px;font-weight:800;letter-spacing:.24em;color:#9ba8d8}
.lab-empty h2{font-size:clamp(24px,4vw,32px);letter-spacing:-.06em;margin:15px 0 12px;color:#f0f2ff}
.lab-empty p{font-size:13px;line-height:1.9;color:#a3acc9;margin:0}
.lab-status{display:inline-flex;align-items:center;gap:8px;margin-top:25px;padding:8px 12px;border:1px solid rgba(154,170,225,.19);border-radius:999px;background:rgba(124,144,208,.08);font-size:10px;color:#b9c3e8}
.lab-status i{width:6px;height:6px;border-radius:50%;background:#8b9bdf;box-shadow:0 0 10px #8b9bdf}
html.theme-dark .lab-stage{border-color:rgba(132,153,208,.2)}
@media(max-width:600px){.lab-stage{min-height:calc(100vh - 125px);padding:28px 16px;border-radius:18px}}
</style>
