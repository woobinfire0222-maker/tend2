<style>
:root{color-scheme:dark;--bg:#10151d;--surface:#1a222e;--soft:#202a38;--ink:#f1f4f9;--muted:#a1acbc;--line:#303b4b;--blue:#78aaff;--bluebg:#263b5c;--green:#67d5a0;--amber:#e0ad58;--red:#f08080}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.lab-page{width:min(100% - 48px,1080px);margin:auto;padding:30px 0 70px}.lab-header{height:52px;display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}.wordmark{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}.wordmark img{width:36px;height:36px;object-fit:contain}.wordmark span{border-left:1px solid var(--line);padding-left:12px;color:var(--muted);font-size:12px;font-weight:700}.back,.btn{height:40px;padding:0 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:#315d9e;border-color:#4779bd;color:white}.btn:disabled{opacity:.5;cursor:wait}.intro{margin-bottom:26px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.13em}.intro h1{font-size:clamp(32px,5vw,44px);letter-spacing:-.06em;margin:13px 0 8px}.intro p{color:var(--muted);font-size:13px;margin:0;line-height:1.7}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;margin-top:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.toolbar strong{font-size:14px}.server-select{width:min(100%,360px)}select,input,textarea{width:100%;background:#111923;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font:inherit;font-size:12px;outline:none}select:focus,input:focus,textarea:focus{border-color:var(--blue)}label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:7px}.field{min-width:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid .wide{grid-column:1/-1}.feature-tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:10px 13px;font-size:12px;font-weight:700;cursor:pointer}.tab.active{background:var(--bluebg);border-color:#45658e;color:#cfe0ff}.feature-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px}.feature-head h2{font-size:19px;letter-spacing:-.04em;margin:0 0 6px}.feature-head p{font-size:11px;line-height:1.7;color:var(--muted);margin:0}.state{font-size:10px;color:var(--muted);white-space:nowrap}.state:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#707b8b;margin-right:7px}.state.on:before{background:var(--green)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{color:var(--muted);font-size:10px;line-height:1.7;margin-top:12px}.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}.rule-list{display:grid;gap:9px;margin-top:14px}.rule{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px}.rule small{display:block;color:var(--muted);margin-top:4px;font-size:10px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.metric{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:15px}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;font-size:23px;margin-top:7px;letter-spacing:-.04em}.data-table{width:100%;border-collapse:collapse;font-size:11px}.data-table th,.data-table td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.data-table th{color:var(--muted);font-weight:650}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#edf2fa;color:#17202c;padding:11px 16px;border-radius:12px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.lab-page{width:calc(100% - 30px);padding:18px 0 45px}.lab-header{margin-bottom:35px}.panel{padding:17px;border-radius:18px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.back{font-size:10px;padding:0 10px}.feature-head{flex-direction:column}}
</style></head>
