.lab-stage{position:relative;min-height:440px;overflow:hidden;border:1px solid #e5e8ef;border-radius:24px;background:#f7f8fa;color:#17191f;padding:clamp(24px,5vw,48px);box-shadow:0 8px 30px rgba(20,30,50,.035)}
.lab-topline{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid #e8ebf0}
.lab-brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:750;letter-spacing:.04em;color:#343943}
.lab-brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:#e9f0ff;color:#2864dc;font-size:17px}
.lab-version{font-size:11px;color:#8b909b}
.lab-content{min-height:320px;display:grid;place-items:center;text-align:center;padding:48px 16px}
.lab-empty{width:min(100%,440px)}
.lab-icon{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;border-radius:20px;background:#edf2ff;color:#326be3;font-size:27px}
.lab-eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;color:#4776d5}
.lab-empty h2{font-size:clamp(23px,4vw,29px);letter-spacing:-.055em;margin:12px 0 10px;color:#191c23}
.lab-empty p{font-size:13px;line-height:1.85;color:#737987;margin:0}
.lab-status{display:inline-flex;align-items:center;gap:7px;margin-top:22px;padding:8px 11px;border:1px solid #e3e8f1;border-radius:9px;background:#fff;font-size:10px;color:#687181}
.lab-status i{width:6px;height:6px;border-radius:50%;background:#9aa4b5}
html.theme-dark .lab-stage{background:#171c26;border-color:#2b3443;color:#f2f4f8;box-shadow:none}
html.theme-dark .lab-topline{border-color:#303947}
html.theme-dark .lab-brand{color:#e1e6ef}

html.theme-dark .lab-icon{background:#263a60;color:#8db3ff}
html.theme-dark .lab-eyebrow{color:#91b3ff}
html.theme-dark .lab-empty h2{color:#f1f3f8}
html.theme-dark .lab-empty p{color:#a0a9b8}
html.theme-dark .lab-status{background:#202836;border-color:#354052;color:#b5bfce}
@media(max-width:600px){.lab-stage{min-height:400px;padding:20px;border-radius:18px}.lab-content{min-height:300px;padding:38px 8px}.lab-version{font-size:10px}}
