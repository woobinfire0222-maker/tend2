<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a10">
<title>디스코드 계정 인증 · TEND</title>
<link rel="stylesheet" href="./portal.css?v=20261108-font-rollback1"><link rel="stylesheet" href="./motion.css?v=20261106-3"><link rel="stylesheet" href="./theme.css?v=20261107-6">
<script>try{if(localStorage.getItem("tend-theme")==="dark")document.documentElement.classList.add("theme-dark")}catch{}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js?v=20261029-3"></script>
<style>
:root{--verify-blue:#3182f6;--verify-ink:#191f28;--verify-sub:#8b95a1;--verify-line:#eef0f2;--verify-soft:#f2f4f6;--verify-card:#fff;--verify-bg:#fff}
html.theme-dark{--verify-ink:#f4f6f8;--verify-sub:#8d98a6;--verify-line:#292e36;--verify-soft:#1b2028;--verify-card:#111419;--verify-bg:#090b0f}
*{box-sizing:border-box}
body{min-height:100vh;background:var(--verify-bg);color:var(--verify-ink);margin:0;font-family:inherit}
.verify-wrap{width:min(420px,calc(100% - 40px));min-height:100vh;margin:0 auto;padding:30px 0 28px;display:flex;flex-direction:column}
.verify-brand{display:inline-flex;align-items:center;gap:8px;width:max-content;font-size:19px;font-weight:850;letter-spacing:-.055em;margin:0;color:var(--verify-ink);text-decoration:none}
.verify-brand img{width:27px;height:27px;object-fit:contain}
.verify-card{flex:1;padding:0;margin-top:66px;border:0;border-radius:0;background:transparent;box-shadow:none}
.verify-kicker{font-size:12px;font-weight:750;letter-spacing:-.01em;color:var(--verify-blue);margin-bottom:14px}
.verify-card h1{font-size:29px;line-height:1.35;letter-spacing:-.065em;margin:0 0 12px;font-weight:800;word-break:keep-all}
.verify-muted{color:var(--verify-sub);line-height:1.65;font-size:15px;margin:0;word-break:keep-all}
.verify-profile{display:flex;align-items:center;gap:13px;padding:15px;margin:30px 0 16px;border:0;border-radius:17px;background:var(--verify-soft)}
.verify-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#dfe4ee}
.verify-profile strong,.verify-profile small{display:block;overflow-wrap:anywhere}
.verify-profile strong{font-size:14px;font-weight:750}.verify-profile small{color:var(--verify-sub);margin-top:4px;font-size:12px}
.verify-server{display:inline-flex;align-items:center;width:max-content;max-width:100%;font-size:12px;font-weight:700;color:var(--verify-sub);margin:18px 0 0;padding:7px 10px;border-radius:8px;background:var(--verify-soft);overflow-wrap:anywhere}
.verify-progress{margin:30px 0 0;padding:20px 18px;border:0;border-radius:18px;background:var(--verify-soft)}
.verify-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.verify-progress-head strong{font-size:14px;letter-spacing:-.02em}.verify-progress-head span{font-size:11px;color:var(--verify-sub)}
.verify-steps{display:grid;gap:15px;position:relative}
.verify-step{display:flex;align-items:center;gap:12px;min-width:0;color:var(--verify-sub);font-size:13px;transition:color .2s ease;position:relative;z-index:1}
.verify-step-dot{width:23px;height:23px;flex:0 0 23px;border-radius:50%;display:grid;place-items:center;background:var(--verify-line);font-size:11px;font-weight:800}
.verify-step-label{min-width:0;line-height:1.4}
.verify-step.is-active{color:var(--verify-ink);font-weight:750}
.verify-step.is-active .verify-step-dot{background:rgba(49,130,246,.13);color:var(--verify-blue);position:relative}
.verify-step.is-active .verify-step-dot:after{content:"";position:absolute;inset:-4px;border:1.5px solid rgba(49,130,246,.35);border-radius:50%;animation:verify-pulse 1.5s ease-out infinite}
.verify-step.is-done{color:var(--verify-ink)}
.verify-step.is-done .verify-step-dot{background:#dff5e9;color:#15945b}
html.theme-dark .verify-step.is-done .verify-step-dot{background:#123526;color:#5bd69a}
.verify-step.is-error{color:#d34c4c}
.verify-step.is-error .verify-step-dot{background:rgba(211,76,76,.12);color:#d34c4c}
@keyframes verify-pulse{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.45);opacity:0}}
.verify-status{padding:0;margin-top:17px;background:transparent;color:var(--verify-sub);font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.verify-status.error{color:#d34c4c}.verify-status.success{color:#15945b}
.verify-actions{display:grid;gap:13px;margin-top:30px}
.verify-actions .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:15px;font-size:15px;font-weight:750;letter-spacing:-.02em;transition:transform .15s ease,filter .15s ease}
.verify-actions .btn:active{transform:scale(.985);filter:brightness(.97)}
.verify-actions .btn-blue{background:var(--verify-blue);color:white;border:0;box-shadow:0 5px 12px rgba(49,130,246,.16)}
.verify-actions .btn-light{background:var(--verify-soft);color:var(--verify-ink);border:0}
.verify-actions .btn-dark{background:var(--verify-blue);color:white;border:0}
.verify-actions a.btn{min-height:auto;padding:8px;background:transparent;color:var(--verify-sub);font-size:13px;font-weight:650;text-decoration:none}
.verify-footnote{text-align:center;font-size:11px;margin:22px 0 0;color:var(--verify-sub);line-height:1.5}
.verify-hidden{display:none!important}
@media(max-width:480px){.verify-wrap{width:calc(100% - 44px);padding-top:25px}.verify-card{margin-top:58px}.verify-card h1{font-size:27px}.verify-profile{margin-top:26px}.verify-progress{margin-top:25px}}
@media(min-height:850px){.verify-card{margin-top:86px}}
@media(prefers-reduced-motion:reduce){.verify-step,.verify-step-dot,.verify-actions .btn{transition:none}.verify-step.is-active .verify-step-dot:after{animation:none}}
</style></head>
<body><main class="verify-wrap"><a class="verify-brand" href="./index.html"><img src="./TEND.png" alt="">TEND</a><section class="verify-card">
<div class="verify-kicker">안전한 계정 인증</div><h1 id="verify-title">디스코드 계정을 인증할게요.</h1><p class="verify-muted" id="verify-description">계정을 확인하고 서버 이용을 위한 인증을 진행해요.</p>
<div id="verify-profile" class="verify-profile verify-hidden"><img id="verify-avatar" class="verify-avatar" alt="Discord 프로필"><div><strong id="verify-name"></strong><small id="verify-id"></small></div></div>
<div id="verify-server" class="verify-server"></div><section id="verify-progress" class="verify-progress verify-hidden" aria-live="polite"><div class="verify-progress-head"><strong id="verify-progress-title">인증 진행 중</strong><span id="verify-progress-caption">안전하게 확인하고 있어요</span></div><div class="verify-steps"><div class="verify-step" data-step="0"><span class="verify-step-dot">1</span><span class="verify-step-label">인증 요청 준비</span></div><div class="verify-step" data-step="1"><span class="verify-step-dot">2</span><span class="verify-step-label">디스코드 계정 확인</span></div><div class="verify-step" data-step="2"><span class="verify-step-dot">3</span><span class="verify-step-label">자동 계정 검사</span></div><div class="verify-step" data-step="3"><span class="verify-step-dot">4</span><span class="verify-step-label">서버 인증 마무리</span></div></div></section>
<div id="verify-status" class="verify-status">인증 링크를 확인하고 있어요.</div>
<div class="verify-actions"><button id="verify-submit" class="btn btn-blue verify-hidden" type="button">인증 시작</button><button id="verify-refresh" class="btn btn-light verify-hidden" type="button" onclick="location.reload()">상태 다시 확인</button><button id="verify-login" class="btn btn-dark verify-hidden" type="button">Discord 계정으로 로그인</button><a class="btn btn-light" href="./index.html">TEND 메인으로</a></div>
</section><p class="verify-footnote">TEND는 Discord 비밀번호나 계정 토큰을 요구하지 않습니다.</p></main>
<script src="./discord-verify-page.js?v=20261112-toss-tune2"></script></body></html>
