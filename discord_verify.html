<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a10">

<link rel="stylesheet" href="./portal.css?v=20261108-font-rollback1"><link rel="stylesheet" href="./motion.css?v=20261106-3"><link rel="stylesheet" href="./theme.css?v=20261107-6">
<script>try{if(localStorage.getItem("tend-theme")==="dark")document.documentElement.classList.add("theme-dark")}catch{}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js?v=20261029-3"></script>
<style>
body{min-height:100vh;background:var(--bg,#f7f8fa)}.verify-wrap{width:min(520px,calc(100% - 32px));margin:8vh auto}.verify-brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:850;margin-bottom:28px}.verify-brand img{width:36px;height:36px;object-fit:contain}.verify-card{padding:28px;border:1px solid var(--line);border-radius:22px;background:var(--card,#fff);box-shadow:0 22px 70px rgba(0,0,0,.08)}.verify-card h1{font-size:25px;letter-spacing:-.05em;margin:0 0 8px}.verify-muted{color:var(--muted);line-height:1.65}.verify-profile{display:flex;align-items:center;gap:14px;padding:16px;margin:20px 0;border:1px solid var(--line);border-radius:16px}.verify-avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#dfe4ee}.verify-profile strong,.verify-profile small{display:block;overflow-wrap:anywhere}.verify-profile small{color:var(--muted);margin-top:4px}.verify-actions{display:grid;gap:10px;margin-top:20px}.verify-actions .btn{width:100%}.verify-status{padding:13px 14px;border-radius:12px;background:var(--soft,#eef3ff);font-size:14px;line-height:1.6;margin-top:14px}.verify-status.error{background:rgba(220,60,60,.1);color:#c43b3b}.verify-status.success{background:rgba(30,160,100,.1);color:#16845a}.verify-server{font-weight:750;margin:18px 0 4px}.verify-hidden{display:none!important}
</style></head>
<body><main class="verify-wrap"><a class="verify-brand" href="./index.html"><img src="./TEND.png" alt="">TEND</a><section class="verify-card">
<div class="kicker">DISCORD ACCOUNT VERIFICATION</div><h1 id="verify-title">디스코드 계정을 확인하고 있어요.</h1><p class="verify-muted" id="verify-description">잠시만 기다려 주세요.</p>
<div id="verify-profile" class="verify-profile verify-hidden"><img id="verify-avatar" class="verify-avatar" alt="Discord 프로필"><div><strong id="verify-name"></strong><small id="verify-id"></small></div></div>
<div id="verify-server" class="verify-server"></div>
<div id="verify-status" class="verify-status">인증 링크를 확인하고 있어요.</div>
<div class="verify-actions"><button id="verify-submit" class="btn btn-blue verify-hidden" type="button">인증 시작</button><button id="verify-refresh" class="btn btn-light verify-hidden" type="button" onclick="location.reload()">상태 다시 확인</button><button id="verify-login" class="btn btn-dark verify-hidden" type="button">Discord 계정으로 로그인</button><a class="btn btn-light" href="./index.html">TEND 메인으로</a></div>
</section><p class="verify-muted" style="text-align:center;font-size:12px;margin-top:18px">TEND는 Discord 비밀번호나 계정 토큰을 요구하지 않습니다.</p></main>
<script src="./discord-verify-page.js?v=20261112-auto1"></script></body></html>
