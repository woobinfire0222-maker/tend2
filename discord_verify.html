<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a10">
<title>디스코드 계정 인증 · TEND</title>
<link rel="stylesheet" href="./portal.css?v=20261108-font-rollback1"><link rel="stylesheet" href="./motion.css?v=20261106-3"><link rel="stylesheet" href="./theme.css?v=20261107-6">
<script>try{if(localStorage.getItem("tend-theme")==="dark")document.documentElement.classList.add("theme-dark")}catch{}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js?v=20261029-3"></script>
<style>
:root{color-scheme:light;--verify-blue:#3182f6;--verify-blue-dark:#1b64da;--verify-ink:#191f28;--verify-sub:#8b95a1;--verify-line:#e9edf2;--verify-soft:#f6f8fa;--verify-card:#fff;--verify-bg:#fff;--verify-green:#16a36a}
html.theme-dark{color-scheme:dark;--verify-ink:#f4f6f8;--verify-sub:#929ba8;--verify-line:#292f38;--verify-soft:#171b22;--verify-card:#11151b;--verify-bg:#080a0e;--verify-green:#50d49a}
*{box-sizing:border-box}
html{min-height:100%;background:var(--verify-bg);scroll-behavior:smooth}
body{min-height:100vh;margin:0;color:var(--verify-ink);font-family:inherit;background:radial-gradient(ellipse 480px 360px at 50% 33%,rgba(49,130,246,.055),transparent 72%),var(--verify-bg);-webkit-font-smoothing:antialiased}
.verify-wrap{position:relative;width:min(440px,calc(100% - 44px));min-height:100svh;margin:0 auto;padding:30px 0 26px;display:flex;flex-direction:column}
.verify-brand{position:relative;z-index:1;display:inline-flex;align-items:center;gap:9px;width:max-content;font-size:20px;font-weight:850;letter-spacing:-.065em;color:var(--verify-ink);text-decoration:none;animation:verify-brand-in .65s cubic-bezier(.2,.8,.2,1) both}
.verify-brand img{width:29px;height:29px;object-fit:contain;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.verify-brand:hover img{transform:rotate(-9deg) scale(1.07)}
.verify-card{position:relative;flex:1;padding:0;margin-top:76px;border:0;border-radius:0;background:transparent;box-shadow:none;animation:verify-content-in .8s cubic-bezier(.2,.8,.2,1) .06s both}
.verify-kicker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;letter-spacing:-.015em;color:var(--verify-blue);margin-bottom:17px}
.verify-kicker:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--verify-blue);box-shadow:0 0 0 4px rgba(49,130,246,.10)}
.verify-card h1{font-size:32px;line-height:1.34;letter-spacing:-.075em;margin:0 0 13px;font-weight:820;word-break:keep-all}
.verify-muted{color:var(--verify-sub);line-height:1.72;font-size:15px;letter-spacing:-.025em;margin:0;word-break:keep-all}
.verify-profile{display:flex;align-items:center;gap:14px;padding:16px;margin:32px 0 16px;border:1px solid var(--verify-line);border-radius:19px;background:var(--verify-card);box-shadow:0 5px 20px rgba(20,35,55,.035);animation:verify-rise .5s cubic-bezier(.2,.8,.2,1) both}
html.theme-dark .verify-profile{box-shadow:0 8px 28px rgba(0,0,0,.18)}
.verify-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--verify-soft);box-shadow:0 0 0 3px var(--verify-soft)}
.verify-profile strong,.verify-profile small{display:block;overflow-wrap:anywhere}
.verify-profile strong{font-size:14px;font-weight:760;letter-spacing:-.025em}.verify-profile small{color:var(--verify-sub);margin-top:5px;font-size:12px;letter-spacing:-.01em}
.verify-server{display:inline-flex;align-items:center;width:max-content;max-width:100%;font-size:12px;font-weight:700;letter-spacing:-.02em;color:var(--verify-sub);margin:19px 0 0;padding:8px 11px;border-radius:9px;background:var(--verify-soft);overflow-wrap:anywhere;transition:background .3s ease,color .3s ease}
.verify-progress{position:relative;overflow:hidden;margin:31px 0 0;padding:21px 19px 22px;border:1px solid var(--verify-line);border-radius:20px;background:var(--verify-card);box-shadow:0 8px 30px rgba(20,35,55,.035);animation:verify-rise .55s cubic-bezier(.2,.8,.2,1) both}
html.theme-dark .verify-progress{box-shadow:0 10px 32px rgba(0,0,0,.2)}
.verify-progress:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,rgba(49,130,246,.65),transparent);transform:translateX(-100%);animation:verify-sheen 3.8s ease-in-out infinite}
.verify-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:19px}
.verify-progress-head strong{font-size:14px;letter-spacing:-.035em}.verify-progress-head span{font-size:11px;color:var(--verify-sub);letter-spacing:-.02em;text-align:right;transition:opacity .25s ease}
.verify-steps{display:grid;gap:16px;position:relative}
.verify-steps:before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:1px;background:var(--verify-line)}
.verify-step{display:flex;align-items:center;gap:12px;min-width:0;color:var(--verify-sub);font-size:13px;letter-spacing:-.025em;transition:color .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s ease;position:relative;z-index:1}
.verify-step-dot{width:23px;height:23px;flex:0 0 23px;border:1px solid var(--verify-line);border-radius:50%;display:grid;place-items:center;background:var(--verify-card);font-size:10px;font-weight:800;transition:all .4s cubic-bezier(.2,.8,.2,1)}
.verify-step-label{min-width:0;line-height:1.4;transition:transform .35s ease}
.verify-step.is-active{color:var(--verify-ink);font-weight:750;transform:translateX(2px)}
.verify-step.is-active .verify-step-dot{border-color:rgba(49,130,246,.18);background:rgba(49,130,246,.10);color:var(--verify-blue);position:relative}
.verify-step.is-active .verify-step-dot:after{content:"";position:absolute;inset:-5px;border:1.5px solid rgba(49,130,246,.28);border-radius:50%;animation:verify-pulse 1.8s cubic-bezier(.2,.65,.3,1) infinite}
.verify-step.is-done{color:var(--verify-ink)}
.verify-step.is-done .verify-step-dot{border-color:transparent;background:#e4f7ed;color:#15945b;transform:scale(1.02)}
html.theme-dark .verify-step.is-done .verify-step-dot{background:#123526;color:#5bd69a}
.verify-step.is-error{color:#d34c4c}
.verify-step.is-error .verify-step-dot{border-color:transparent;background:rgba(211,76,76,.12);color:#d34c4c}
.verify-status{min-height:22px;padding:0;margin-top:17px;background:transparent;color:var(--verify-sub);font-size:13px;line-height:1.7;letter-spacing:-.02em;overflow-wrap:anywhere;transition:color .25s ease,opacity .25s ease}
.verify-status.error{color:#d34c4c}.verify-status.success{color:var(--verify-green)}
.verify-actions{display:grid;gap:10px;margin-top:30px}
.verify-actions .btn{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:16px;font-size:15px;font-weight:760;letter-spacing:-.035em;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .25s ease,box-shadow .25s ease,filter .25s ease;cursor:pointer}
.verify-actions .btn:focus-visible{outline:3px solid rgba(49,130,246,.25);outline-offset:3px}
.verify-actions .btn:active{transform:scale(.975)}
.verify-actions .btn:disabled{cursor:wait;opacity:.72;transform:none}
.verify-actions .btn-blue,.verify-actions .btn-dark{background:var(--verify-blue);color:#fff;border:0;box-shadow:0 7px 16px rgba(49,130,246,.18),inset 0 1px 0 rgba(255,255,255,.16)}
.verify-actions .btn-blue:hover,.verify-actions .btn-dark:hover{background:var(--verify-blue-dark);box-shadow:0 9px 22px rgba(49,130,246,.24);transform:translateY(-1px)}
.verify-actions .btn-light{background:var(--verify-soft);color:var(--verify-ink);border:0}
.verify-actions a.btn{min-height:42px;padding:8px;background:transparent;color:var(--verify-sub);font-size:13px;font-weight:650;text-decoration:none;transition:color .2s ease}
.verify-actions a.btn:hover{color:var(--verify-blue)}
.verify-footnote{text-align:center;font-size:11px;margin:25px 0 0;color:var(--verify-sub);line-height:1.6;letter-spacing:-.015em}
.verify-hidden{display:none!important}
@keyframes verify-brand-in{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
@keyframes verify-content-in{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes verify-rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes verify-pulse{0%{transform:scale(.82);opacity:.8}75%,100%{transform:scale(1.48);opacity:0}}
@keyframes verify-sheen{0%,20%{transform:translateX(-100%)}65%,100%{transform:translateX(100%)}}
@media(max-width:480px){.verify-wrap{width:calc(100% - 44px);padding-top:25px}.verify-card{margin-top:65px}.verify-card h1{font-size:29px}.verify-profile{margin-top:27px}.verify-progress{margin-top:26px;padding:19px 17px 20px}}
@media(min-height:850px){.verify-card{margin-top:88px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="verify-wrap"><a class="verify-brand" href="./index.html"><img src="./TEND.png" alt="">TEND</a><section class="verify-card">
<div class="verify-kicker">안전한 계정 인증</div><h1 id="verify-title">디스코드 계정을 인증할게요.</h1><p class="verify-muted" id="verify-description">계정을 확인하고 서버 이용을 위한 인증을 진행해요.</p>
<div id="verify-profile" class="verify-profile verify-hidden"><img id="verify-avatar" class="verify-avatar" alt="Discord 프로필"><div><strong id="verify-name"></strong><small id="verify-id"></small></div></div>
<div id="verify-server" class="verify-server"></div><section id="verify-progress" class="verify-progress verify-hidden" aria-live="polite"><div class="verify-progress-head"><strong id="verify-progress-title">인증 진행 중</strong><span id="verify-progress-caption">안전하게 확인하고 있어요</span></div><div class="verify-steps"><div class="verify-step" data-step="0"><span class="verify-step-dot">1</span><span class="verify-step-label">인증 요청 준비</span></div><div class="verify-step" data-step="1"><span class="verify-step-dot">2</span><span class="verify-step-label">디스코드 계정 확인</span></div><div class="verify-step" data-step="2"><span class="verify-step-dot">3</span><span class="verify-step-label">자동 계정 검사</span></div><div class="verify-step" data-step="3"><span class="verify-step-dot">4</span><span class="verify-step-label">서버 인증 마무리</span></div></div></section>
<div id="verify-status" class="verify-status">인증 링크를 확인하고 있어요.</div>
<div class="verify-actions"><button id="verify-submit" class="btn btn-blue verify-hidden" type="button">인증 시작</button><button id="verify-refresh" class="btn btn-light verify-hidden" type="button" onclick="location.reload()">상태 다시 확인</button><button id="verify-login" class="btn btn-dark verify-hidden" type="button">Discord 계정으로 로그인</button><a class="btn btn-light" href="./index.html">TEND 메인으로</a></div>
</section><p class="verify-footnote">TEND는 Discord 비밀번호나 계정 토큰을 요구하지 않습니다.</p></main>
<script src="./discord-verify-page.js?v=20261112-toss-motion3"></script></body></html>
